<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegant 3D Experience</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      pointer-events: none;
      width: 100%;
    }
    
    h1 {
      font-size: 5rem;
      font-weight: 200;
      letter-spacing: 16px;
      margin: 0;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #666666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 4s infinite alternate;
      text-indent: 16px; /* Offset letter spacing for centering */
    }
    
    p {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 8px;
      color: #888888;
      margin-top: 20px;
      text-transform: uppercase;
      text-indent: 8px;
    }
    
    @keyframes pulse {
      0% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
      100% { filter: drop-shadow(0 0 25px rgba(255,255,255,0.4)); }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div class="overlay">
    <h1>Quantum Core</h1>
    <p>Next Generation Intelligence</p>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.003);
    
    // Camera setup
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 18;
    
    // Renderer setup
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    // Create central elegant object (Icosahedron)
    const geometry = new THREE.IcosahedronGeometry(5, 1);
    
    // Materials
    const materialSolid = new THREE.MeshPhysicalMaterial({
      color: 0x111111,
      metalness: 0.9,
      roughness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      transparent: true,
      opacity: 0.85
    });
    
    const materialWireframe = new THREE.MeshBasicMaterial({
      color: 0x00e5ff,
      wireframe: true,
      transparent: true,
      opacity: 0.2
    });
    
    // Meshes
    const core = new THREE.Mesh(geometry, materialSolid);
    const wireframe = new THREE.Mesh(geometry, materialWireframe);
    wireframe.scale.set(1.08, 1.08, 1.08); // Slightly larger
    
    scene.add(core);
    scene.add(wireframe);
    
    // Particles (stars/dust)
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 80; // Spread over a large area
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.06,
      color: 0xffffff,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
    
    const pointLight1 = new THREE.PointLight(0x00e5ff, 2.5, 100);
    pointLight1.position.set(15, 15, 15);
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0x9d00ff, 2.5, 100);
    pointLight2.position.set(-15, -15, 15);
    scene.add(pointLight2);
    
    // Mouse interaction variables
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;
    
    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - windowHalfX) * 0.001;
      mouseY = (event.clientY - windowHalfY) * 0.001;
    });
    
    // Animation Loop
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();
      
      // Continuous slow rotation for the core
      core.rotation.y += 0.002;
      core.rotation.x += 0.001;
      
      // Wireframe rotates slightly faster and in opposite direction
      wireframe.rotation.y -= 0.003;
      wireframe.rotation.x -= 0.002;
      
      // Ambient particle rotation
      particlesMesh.rotation.y = -elapsedTime * 0.02;
      
      // Parallax mouse effect (easing)
      targetX = mouseX * 1.5;
      targetY = mouseY * 1.5;
      
      core.rotation.y += 0.05 * (targetX - core.rotation.y);
      core.rotation.x += 0.05 * (targetY - core.rotation.x);
      
      wireframe.rotation.y += 0.05 * (targetX - wireframe.rotation.y);
      wireframe.rotation.x += 0.05 * (targetY - wireframe.rotation.x);
      
      // Move camera slightly based on mouse position
      camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 5 - camera.position.y) * 0.02;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
